---
commitizen:
  name: cz_conventional_commits
  tag_format: v$version
  update_changelog_on_bump: true
  # El archivo del repo es minúscula; por defecto commitizen escribe
  # CHANGELOG.md y en Linux eso creaba un archivo distinto.
  changelog_file: changelog.md
  # Lo mantiene el workflow de release; refleja el último tag publicado.
  version: 1.3.10
  version_scheme: semver
  version_files:
    - app/main.py:version
