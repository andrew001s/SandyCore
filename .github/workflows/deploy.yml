name: Build and Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: andrew001s/sandycore

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-droplet:
    name: Deploy to DigitalOcean Droplet
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy docker-compose.yml and Caddyfile to Droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_SSH_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/sandycore"
          overwrite: true

      - name: Deploy and Restart Container via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          ACTOR: ${{ github.actor }}
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.DO_DROPLET_HOST }}
          username: ${{ secrets.DO_SSH_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: ${{ secrets.DO_SSH_PORT || 22 }}
          envs: GHCR_PAT,ACTOR,ENV_CONTENT
          script: |
            set -e
            mkdir -p /opt/sandycore
            cd /opt/sandycore

            # 1. Si existe el secreto ENV_FILE en GitHub, escribir /opt/sandycore/.env
            if [ -n "$ENV_CONTENT" ]; then
              printf "%s\n" "$ENV_CONTENT" > .env
              chmod 600 .env
              echo "✅ Archivo .env sincronizado desde GitHub Secrets."
            elif [ ! -f .env ]; then
              echo "⚠️ AVISO: No se encontró /opt/sandycore/.env en el Droplet ni el secreto ENV_FILE en GitHub."
            fi

            # 2. Iniciar sesión en GHCR si se proporcionó token
            if [ -n "$GHCR_PAT" ]; then
              echo "$GHCR_PAT" | docker login ghcr.io -u "$ACTOR" --password-stdin
            fi

            # 3. Descargar la versión más reciente construida por GitHub Actions
            docker compose pull

            # 4. Levantar o reiniciar servicios (SandyCore y Caddy Gateway)
            docker compose up -d --remove-orphans

            # 5. Recargar configuración de Caddy en caliente si ya estaba corriendo
            docker exec caddy caddy reload --config /etc/caddy/Caddyfile 2>/dev/null || true

            # 6. Limpiar capas e imágenes huérfanas antiguas
            docker image prune -f

            echo "✅ Despliegue de SandyCore completado con éxito."
