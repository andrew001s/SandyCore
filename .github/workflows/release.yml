name: Publish Release Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: >
          Bump a aplicar. Con "auto" se deriva de los mensajes de commit
          (BREAKING CHANGE o "!" -> major, feat -> minor, fix -> patch).
        required: false
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Commitizen
        run: pip install commitizen

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        shell: bash
        run: |
          set -uo pipefail

          bump_input="${{ inputs.bump || 'auto' }}"
          args=(bump --yes)
          if [ "$bump_input" != "auto" ]; then
            args+=(--increment "$(echo "$bump_input" | tr '[:lower:]' '[:upper:]')")
          fi

          # `shell: bash` activa -e por defecto; hay que desactivarlo para poder
          # inspeccionar el código de salida de cz en vez de abortar el step.
          set +e
          # cz bump deriva el incremento de los commits convencionales,
          # actualiza .cz.yaml y app/main.py (version_files), escribe el
          # changelog y crea el tag.
          cz "${args[@]}"
          status=$?
          set -e

          # 21 = NO_COMMITS_TO_BUMP: solo hubo docs/chore/style desde el último
          # release. No es un fallo, simplemente no hay nada que publicar.
          if [ "$status" -eq 21 ]; then
            echo "Sin commits que ameriten un release; no se crea tag."
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" -ne 0 ]; then
            echo "cz bump falló con código $status"
            exit "$status"
          fi

          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$(cz version --project)" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        if: steps.bump.outputs.bumped == 'true'
        run: git push --follow-tags origin HEAD:main

      - name: Summary
        if: steps.bump.outputs.bumped == 'true'
        run: |
          echo "Publicado v${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
