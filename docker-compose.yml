services:
  sandycore:
    image: ghcr.io/andrew001s/sandycore:latest
    container_name: sandycore
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - MALLOC_ARENA_MAX=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/memory"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Rotación de logs para evitar llenar el disco del Droplet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
