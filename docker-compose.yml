services:
  sandycore:
    image: ghcr.io/andrew001s/sandycore:latest
    container_name: sandycore
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - MALLOC_ARENA_MAX=2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/memory"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Rotación de logs para evitar llenar el disco del Droplet
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - web-gateway

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web-gateway
    depends_on:
      - sandycore
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  web-gateway:
    name: web-gateway

volumes:
  caddy_data:
  caddy_config:
